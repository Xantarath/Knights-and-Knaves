<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Knights & Knaves - Gear Sheet</title>

    <link
        rel="stylesheet"
        href="css/gear-sheet.css"
    >

</head>


<body>


    <!-- =====================================================
         RESPONSIVE WRAPPER
         ===================================================== -->

    <div class="sheet-wrapper">


        <!-- =================================================
             GEAR SHEET
             ================================================= -->

        <div
            class="gear-sheet"
            id="gearSheet"
        >
        
<!-- =============================================
     SHEET NAVIGATION
     ============================================= -->

<a
    href="index.html"
    class="sheet-nav-button previous-sheet-button"
    aria-label="Previous Sheet"
    title="Main Sheet"
>
    ←
</a>

<a
    href="builder-gear.html"
    class="sheet-nav-button mode-nav-button"
    aria-label="Go to Character Builder"
    title="Character Builder"
>
    B
</a>

<a
    href="index.html"
    class="sheet-nav-button next-sheet-button"
    aria-label="Next Sheet"
    title="Main Sheet"
>
    →
</a>

            <!-- =============================================
                 BACKGROUND
                 ============================================= -->

            <img
                class="sheet-background"
                src="images/gear-sheet.png"
                alt="Gear Sheet"
            >


            <!-- =============================================
                 CENTRAL EQUIPMENT LOCATIONS
                 ============================================= -->


            <!-- LEFT HAND -->

            <button
                type="button"
                id="leftHandSlot"
                class="location-slot"
                aria-label="Left hand"
            ></button>


            <!-- RIGHT HAND -->

            <button
                type="button"
                id="rightHandSlot"
                class="location-slot"
                aria-label="Right hand"
            ></button>


            <!-- LEFT SIDEARM -->

            <button
                type="button"
                id="leftSidearmSlot"
                class="location-slot"
                aria-label="Left sidearm"
            ></button>


            <!-- RIGHT SIDEARM -->

            <button
                type="button"
                id="rightSidearmSlot"
                class="location-slot"
                aria-label="Right sidearm"
            ></button>


            <!-- LEFT GIGUE -->

            <button
                type="button"
                id="leftGigueSlot"
                class="location-slot"
                aria-label="Left Gigue"
            ></button>


           <!-- RIGHT GIGUE -->

            <button
                type="button"
                id="rightGigueSlot"
                class="location-slot"
                aria-label="Right Gigue"
            ></button>


 <!-- =============================================
      ARMOR
      ============================================= -->


<!-- FULL ARMOR STAT SECTION -->

<div
    id="armorNameSection"
    class="armor-blackout-section armor-name-section"
    data-armor-section="name"
></div>


<!-- FULL DURABILITY SECTION -->

<div
    id="armorDurabilitySection"
    class="armor-blackout-section armor-durability-section"
    data-armor-section="durability"
></div>


<!-- FULL PADDING SECTION -->

<div
    id="armorPaddingSection"
    class="armor-blackout-section armor-padding-section"
    data-armor-section="padding"
></div>


<!-- ACTUAL DISPLAY VALUES -->

<div
    id="armorName"
    class="armor-display"
    data-armor-field="name"
></div>

<div
    id="armorDurability"
    class="armor-display"
    data-armor-field="durability"
></div>

<div
    id="armorPadding"
    class="armor-display"
    data-armor-field="padding"
></div>


            <!-- =============================================
                 PICK UP
                 ============================================= -->

            <button
                type="button"
                id="leftPickupButton"
                class="pickup-button"
            ></button>

            <select
                id="leftPickupSelect"
                class="pickup-select"
                aria-label="Choose a weapon to pick up in the left hand"
            >
                <option value="">
                    Choose Weapon
                </option>
            </select>


            <button
                type="button"
                id="rightPickupButton"
                class="pickup-button"
            ></button>

            <select
                id="rightPickupSelect"
                class="pickup-select"
                aria-label="Choose a weapon to pick up in the right hand"
            >
                <option value="">
                    Choose Weapon
                </option>
            </select>


            <!-- =============================================
                 LEFT SWASHBUCKLING BUCKLER
                 ============================================= -->

            <div
                id="leftBucklerColumn"
                class="item-column buckler-column empty"
            >

                <button
                    type="button"
                    class="column-name"
                    data-column="leftBuckler"
                ></button>

                <div class="column-reach"></div>

                <div class="column-fixed-stat"></div>

            </div>


            <!-- =============================================
                 RIGHT SWASHBUCKLING BUCKLER
                 ============================================= -->

            <div
                id="rightBucklerColumn"
                class="item-column buckler-column empty"
            >

                <button
                    type="button"
                    class="column-name"
                    data-column="rightBuckler"
                ></button>

                <div class="column-reach"></div>

                <div class="column-fixed-stat"></div>

            </div>


            <!-- =============================================
                 LEFT EQUIPPED ITEM
                 ============================================= -->

            <div
                id="leftHandColumn"
                class="item-column tall-column empty"
            >

                <button
                    type="button"
                    class="column-name"
                    data-column="leftHand"
                ></button>

                <div class="column-reach"></div>

                <div class="dynamic-row" data-row="0">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="1">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="2">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="3">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="4">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="5">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="6">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="column-weight"></div>

            </div>


            <!-- =============================================
                 RIGHT EQUIPPED ITEM
                 ============================================= -->

            <div
                id="rightHandColumn"
                class="item-column tall-column empty"
            >

                <button
                    type="button"
                    class="column-name"
                    data-column="rightHand"
                ></button>

                <div class="column-reach"></div>

                <div class="dynamic-row" data-row="0">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="1">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="2">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="3">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="4">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="5">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="6">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="column-weight"></div>

            </div>


            <!-- =============================================
                 LEFT STOWED SIDEARM
                 ============================================= -->

            <div
                id="leftSidearmColumn"
                class="item-column sidearm-column empty"
            >

                <button
                    type="button"
                    class="column-name"
                    data-column="leftSidearm"
                ></button>

                <div class="column-reach"></div>

                <div class="dynamic-row" data-row="0">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="1">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="2">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="3">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="column-weight"></div>

            </div>


            <!-- =============================================
                 RIGHT STOWED SIDEARM
                 ============================================= -->

            <div
                id="rightSidearmColumn"
                class="item-column sidearm-column empty"
            >

                <button
                    type="button"
                    class="column-name"
                    data-column="rightSidearm"
                ></button>

                <div class="column-reach"></div>

                <div class="dynamic-row" data-row="0">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="1">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="2">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="dynamic-row" data-row="3">
                    <span class="dynamic-name"></span>
                    <span class="dynamic-value"></span>
                </div>

                <div class="column-weight"></div>

            </div>


            <!-- =============================================
                 GIGUE SHIELD DETAIL
                 ============================================= -->

            <div
                id="gigueShieldColumn"
                class="item-column shield-column empty"
            >

                <button
                    type="button"
                    class="column-name"
                    data-column="gigueShield"
                ></button>

                <div class="column-reach"></div>

                <div class="column-fixed-stat block-value"></div>

                <div
                class="column-fixed-stat durability-value"
                ></div>

                <div class="column-weight"></div>

            </div>


        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/character-state.js"></script>

<script src="js/equipment-data.js"></script>

<script src="js/gear-sheet.js"></script>


</body>

</html>
