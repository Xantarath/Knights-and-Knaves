<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Knights & Knaves - Builder: Physique & Gear</title>

    <link rel="stylesheet" href="css/builder-gear.css">
</head>

<body>

    <!-- =====================================================
         RESPONSIVE WRAPPER
         ===================================================== -->

    <div class="sheet-wrapper">

        <div class="builder-sheet" id="builderSheet">

            <!-- =============================================
     SHEET NAVIGATION
     ============================================= -->

<a
    href="builder-skills.html"
    class="sheet-nav-button previous-sheet-button"
    aria-label="Previous Builder Sheet"
    title="Builder Skills"
>
    ←
</a>

<a
    href="index.html"
    class="sheet-nav-button mode-nav-button"
    aria-label="Go to Main Sheet"
    title="Main Sheet"
>
    M
</a>

<a
    href="builder-skills.html"
    class="sheet-nav-button next-sheet-button"
    aria-label="Next Builder Sheet"
    title="Builder Skills"
>
    →
</a>

            <img
                class="sheet-background"
                src="images/builder-gear.png"
                alt="Physique and Gear Builder"
            >


            <!-- =================================================
                 POINT COUNTER
                 ================================================= -->

            <button
                type="button"
                id="pointsCounter"
                class="points-counter"
                title="Click to reset the builder"
                aria-label="Points remaining. Click to reset builder."
            >
                30
            </button>


            <!-- =================================================
                 PHYSIQUE - SINGLE SELECT
                 ================================================= -->

            <button type="button" class="single-choice physique-choice" data-group="physique" data-value="Massive" data-cost="10" aria-label="Massive"></button>
            <button type="button" class="single-choice physique-choice" data-group="physique" data-value="Huge" data-cost="7" aria-label="Huge"></button>
            <button type="button" class="single-choice physique-choice" data-group="physique" data-value="Bulky" data-cost="4" aria-label="Bulky"></button>
            <button type="button" class="single-choice physique-choice" data-group="physique" data-value="Muscular" data-cost="2" aria-label="Muscular"></button>
            <button type="button" class="single-choice physique-choice" data-group="physique" data-value="Athletic" data-cost="1" aria-label="Athletic"></button>
            <button type="button" class="single-choice physique-choice" data-group="physique" data-value="Average" data-cost="0" aria-label="Average"></button>
            <button type="button" class="single-choice physique-choice" data-group="physique" data-value="Toned" data-cost="1" aria-label="Toned"></button>
            <button type="button" class="single-choice physique-choice" data-group="physique" data-value="Lean" data-cost="2" aria-label="Lean"></button>
            <button type="button" class="single-choice physique-choice" data-group="physique" data-value="Slender" data-cost="4" aria-label="Slender"></button>
            <button type="button" class="single-choice physique-choice" data-group="physique" data-value="Small" data-cost="7" aria-label="Small"></button>
            <button type="button" class="single-choice physique-choice" data-group="physique" data-value="Meek" data-cost="10" aria-label="Meek"></button>


            <!-- =================================================
                 HEIGHT - SINGLE SELECT / FREE
                 ================================================= -->

            <button type="button" class="single-choice height-choice" data-group="height" data-value="Tall" data-cost="0" aria-label="Tall"></button>
            <button type="button" class="single-choice height-choice" data-group="height" data-value="Average" data-cost="0" aria-label="Average height"></button>
            <button type="button" class="single-choice height-choice" data-group="height" data-value="Short" data-cost="0" aria-label="Short"></button>


            <!-- =================================================
                 ARMOR - SINGLE SELECT
                 ================================================= -->

            <button type="button" class="single-choice armor-choice" data-group="armor" data-value="light" data-cost="5" aria-label="Light armor"></button>
            <button type="button" class="single-choice armor-choice" data-group="armor" data-value="medium" data-cost="7" aria-label="Medium armor"></button>
            <button type="button" class="single-choice armor-choice" data-group="armor" data-value="heavy" data-cost="10" aria-label="Heavy armor"></button>


            <!-- =================================================
                 EQUIPMENT - QUANTITY BOXES

                 Click/tap cycles:
                     empty -> 1 -> 2 -> ... -> empty

                 The script automatically stops quantities that
                 would exceed points, Hand Slots, or Sidearm Slots.
                 ================================================= -->


            <!-- SHIELDS: one-handed, not sidearm-capable -->

            <button type="button" class="quantity-choice shield-choice" data-item="buckler" data-cost="3" data-hands="1" data-sidearm="false" aria-label="Buckler"></button>
            <button type="button" class="quantity-choice shield-choice" data-item="heater" data-cost="2" data-hands="1" data-sidearm="false" aria-label="Heater shield"></button>
            <button type="button" class="quantity-choice shield-choice" data-item="kite" data-cost="3" data-hands="1" data-sidearm="false" aria-label="Kite shield"></button>
            <button type="button" class="quantity-choice shield-choice" data-item="round" data-cost="5" data-hands="1" data-sidearm="false" aria-label="Round shield"></button>
            <button type="button" class="quantity-choice shield-choice" data-item="tower" data-cost="7" data-hands="1" data-sidearm="false" aria-label="Tower shield"></button>


            <!-- SWORDS -->

            <button type="button" class="quantity-choice sword-choice" data-item="dagger" data-cost="0" data-hands="1" data-sidearm="true" aria-label="Dagger"></button>
            <button type="button" class="quantity-choice sword-choice" data-item="shortsword" data-cost="2" data-hands="1" data-sidearm="true" aria-label="Shortsword"></button>
            <button type="button" class="quantity-choice sword-choice" data-item="falchion" data-cost="3" data-hands="1" data-sidearm="true" aria-label="Falchion"></button>
            <button type="button" class="quantity-choice sword-choice" data-item="arming-sword" data-cost="3" data-hands="1" data-sidearm="true" aria-label="Arming Sword"></button>
            <button type="button" class="quantity-choice sword-choice" data-item="bastard-sword" data-cost="4" data-hands="1" data-sidearm="false" aria-label="Bastard Sword"></button>
            <button type="button" class="quantity-choice sword-choice" data-item="longsword" data-cost="4" data-hands="1" data-sidearm="false" aria-label="Longsword"></button>
            <button type="button" class="quantity-choice sword-choice" data-item="war-sword" data-cost="5" data-hands="1" data-sidearm="false" aria-label="War Sword"></button>
            <button type="button" class="quantity-choice sword-choice" data-item="estoc" data-cost="5" data-hands="2" data-sidearm="false" aria-label="Estoc"></button>
            <button type="button" class="quantity-choice sword-choice" data-item="greatsword" data-cost="6" data-hands="2" data-sidearm="false" aria-label="Greatsword"></button>


            <!-- BLUDGEONS -->

            <button type="button" class="quantity-choice bludgeon-choice" data-item="club" data-cost="0" data-hands="1" data-sidearm="true" aria-label="Club"></button>
            <button type="button" class="quantity-choice bludgeon-choice" data-item="mace" data-cost="2" data-hands="1" data-sidearm="true" aria-label="Mace"></button>
            <button type="button" class="quantity-choice bludgeon-choice" data-item="warhammer" data-cost="3" data-hands="1" data-sidearm="false" aria-label="Warhammer"></button>
            <button type="button" class="quantity-choice bludgeon-choice" data-item="morning-star" data-cost="4" data-hands="1" data-sidearm="false" aria-label="Morning Star"></button>
            <button type="button" class="quantity-choice bludgeon-choice" data-item="maul" data-cost="1" data-hands="2" data-sidearm="false" aria-label="Maul"></button>
            <button type="button" class="quantity-choice bludgeon-choice" data-item="goedendag" data-cost="2" data-hands="1" data-sidearm="false" aria-label="Goedendag"></button>


            <!-- POLEARMS -->

            <button type="button" class="quantity-choice polearm-choice" data-item="stave" data-cost="0" data-hands="2" data-sidearm="false" aria-label="Stave"></button>
            <button type="button" class="quantity-choice polearm-choice" data-item="spear" data-cost="1" data-hands="1" data-sidearm="false" aria-label="Spear"></button>
            <button type="button" class="quantity-choice polearm-choice" data-item="pike" data-cost="2" data-hands="2" data-sidearm="false" aria-label="Pike"></button>
            <button type="button" class="quantity-choice polearm-choice" data-item="swordstaff" data-cost="5" data-hands="2" data-sidearm="false" aria-label="Swordstaff"></button>
            <button type="button" class="quantity-choice polearm-choice" data-item="poleaxe" data-cost="5" data-hands="2" data-sidearm="false" aria-label="Poleaxe"></button>
            <button type="button" class="quantity-choice polearm-choice" data-item="bec-de-corbin" data-cost="5" data-hands="2" data-sidearm="false" aria-label="Bec de Corbin"></button>
            <button type="button" class="quantity-choice polearm-choice" data-item="glaive" data-cost="4" data-hands="2" data-sidearm="false" aria-label="Glaive"></button>
            <button type="button" class="quantity-choice polearm-choice" data-item="billhook" data-cost="5" data-hands="2" data-sidearm="false" aria-label="Billhook"></button>
            <button type="button" class="quantity-choice polearm-choice" data-item="halberd" data-cost="5" data-hands="2" data-sidearm="false" aria-label="Halberd"></button>


            <!-- AXES -->

            <button type="button" class="quantity-choice axe-choice" data-item="handaxe" data-cost="1" data-hands="1" data-sidearm="true" aria-label="Handaxe"></button>
            <button type="button" class="quantity-choice axe-choice" data-item="battle-axe" data-cost="2" data-hands="1" data-sidearm="false" aria-label="Battle Axe"></button>
            <button type="button" class="quantity-choice axe-choice" data-item="dane-axe" data-cost="3" data-hands="2" data-sidearm="false" aria-label="Dane Axe"></button>


            <!-- FLAILS -->

            <button type="button" class="quantity-choice flail-choice" data-item="flail" data-cost="2" data-hands="1" data-sidearm="false" aria-label="Flail"></button>
            <button type="button" class="quantity-choice flail-choice" data-item="chain-flail" data-cost="3" data-hands="1" data-sidearm="false" aria-label="Chain Flail"></button>
            <button type="button" class="quantity-choice flail-choice" data-item="war-flail" data-cost="1" data-hands="2" data-sidearm="false" aria-label="War Flail"></button>


            <!-- =================================================
                 OPTIONAL DEBUG CAPACITY READOUT

                 Kept invisible by default. If you want to see
                 Hand / Sidearm use while testing, change
                 display:none to display:block in the CSS.
                 ================================================= -->

            <div id="capacityDebug" aria-hidden="true"></div>

        </div>

    </div>


    <!-- Shared data first, page-specific behavior second. -->

    <script src="js/character-state.js"></script>
    <script src="js/builder-gear.js"></script>

</body>
</html>
